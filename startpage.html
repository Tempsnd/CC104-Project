<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue Game</title>
    <style>
      @font-face {
        font-family: "Origin Tech";
        src: url("../Customer-Queue-Game/assets/fonts/OriginTechRegular.woff")
        format("woff");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Origin Tech";
        color: rgba(255, 255, 255, 0.905);
      }

      body {
        background-image: linear-gradient(90deg, #0b1026, black);
      }
      h1 {
        text-align: center;
        font-size: 75px;
        margin-bottom: 60px;
      }

      h2 {
        text-align: center;
        margin-bottom: 60px;
        color: rgb(35, 35, 177);
      }

      header {
        display: flex;
        justify-content: center;
      }

      ul {
        display: flex;
        gap: 100px;
      }

      .creator {
        display: block;
        align-items: center;
        text-align: center;
      }
      ul li {
        list-style: none;
      }

      img {
        height: 90px;
      }

      .one, .two, .three, img {
        border-radius: 10px;
      }

      a {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: white;
        color: black;
        font-size: 50px;
        padding: 20px;
        border-radius: 9px;
        box-shadow: 0 0 40px white;
        outline: 5px dotted rgba(0, 0, 0, 0.449);
        cursor: pointer;
        text-decoration: none;
        cursor: crosshair;
      }
      .one img:hover {
        content: url(../Customer-Queue-Game/assets/img/david/913911680_1447970100781094_5712307893808815915_n.png);
      }
      .two img:hover {
        content: url("../Customer-Queue-Game/assets/img/darwin/04067009-c1f2-4f6e-82ec-7fe77ae37bcc.jpg");
      }

      .three img:hover {
        content: url(../Customer-Queue-Game/assets/img/Rhamz/f19b21a1-38b8-4819-a5c5-196e39dfe626.jpg);
      }
      .four img:hover {
        content: url("../Customer-Queue-Game/assets/img/Dominic/913531908_2128579904685639_6473671721193397563_n.jpg")
      }

      a:hover {
        outline: 5px dotted black;
        font-size: 0;
      }
      a:hover::after {
        content: "Let Us Start";
        font-size: 50px;
        text-decoration: none;
      }
      


      
    </style>
  </head>
  <body>
    <h1>Queue Game</h1>
    <h2>Developers</h2>
    <header>
      <ul>
        <div class="creator one">
          <img
            src="../Customer-Queue-Game/assets/img/david/914434826_1135657729106387_475444346712347808_n.jpg"
            alt="davidi"
          />
          <li>David John</li>
        </div>
        <div class="creator two">
          <img
            src="../Customer-Queue-Game/assets/img/darwin/e7c9ad3c-6ca9-430a-abf2-6d88e9dd9d68.jpg"
            alt="darwin"
          />
          <li>Darwin Frias</li>
        </div>
        <div class="creator three">
            <img src="../Customer-Queue-Game/assets/img/Rhamz/14ebaba3-1f43-4235-996d-5ab7a9a539fb.jpg" alt="rhamz">
          <li>Rhamz Ramos</li>
        </div>
        <div class="creator four">
          <img src="../Customer-Queue-Game/assets/img/Dominic/910879125_1818664192712113_3842737022160444884_n.jpg" alt="dominic">
          <li>Dominic Perez</li>
        </div>
      </ul>
    </header>

    <a href="./index.html" target="_blank" rel="noopener noreferrer"
      >Start Game!</a
    >
  </body>
</html>
